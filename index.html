<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ms. Mia English Class – Story Reader</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3e2;--dot:#fbddab;--side:#fff8ee;--card:#fff;--panel:#fffdf9;--ink:#444;--muted:#8a7a63;--accent:#d9a066;--hl:#ffe9a8;--on:#ffd84d;--onink:#3a2c00;--blob:#ffd84d;--blobink:#5b4a1e;--shadow:rgba(180,120,40,.18);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1812;--dot:#2e2519;--side:#241e16;--card:#322819;--panel:#2a2319;--ink:#f1e8d8;--muted:#b9a68a;--accent:#e3b27a;--hl:#5a4620;--shadow:rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#1d1812;--dot:#2e2519;--side:#241e16;--card:#322819;--panel:#2a2319;--ink:#f1e8d8;--muted:#b9a68a;--accent:#e3b27a;--hl:#5a4620;--shadow:rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:"Nunito","Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg) radial-gradient(var(--dot) 2.5px,transparent 3px) 0 0/46px 46px;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:grid;grid-template-columns:clamp(200px,22vw,350px) 1fr;grid-template-rows:minmax(0,1fr)}
aside{background:var(--side);display:flex;flex-direction:column;min-height:0;padding:0 0 12px 22px}
.logo{margin:clamp(14px,6vh,64px) 0 clamp(12px,4.5vh,40px) calc(clamp(200px,22vw,350px)*.2);width:min(215px,80%);padding:clamp(12px,2.6vh,22px) 20px clamp(12px,2.4vh,20px) 26px;background:var(--blob);color:var(--blobink);border-radius:58% 42% 52% 48%/62% 55% 45% 38%;box-shadow:0 8px 18px var(--shadow);position:relative}
.logo b{display:block;font-size:30px;font-weight:800;line-height:1.1}
.logo span{font-size:21px;font-weight:600}
.logo svg{position:absolute;right:-6px;top:6px}
.sub{margin:0 0 14px;text-align:center;letter-spacing:.14em;font-weight:800;color:var(--accent);font-size:clamp(15px,1.4vw,21px);padding-right:22px}
nav{overflow-y:auto;padding:0 12px 6px 0;flex:1;min-height:0}
nav h3{margin:16px 0 8px;font-size:13px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
nav button{display:block;width:100%;text-align:left;margin:0 0 clamp(8px,1.6vh,14px);padding:clamp(10px,2.2vh,19px) 20px;border:0;border-radius:16px;background:var(--card);color:var(--ink);font:800 clamp(15px,1.25vw,19px)/1.2 inherit;font-family:inherit;box-shadow:0 3px 10px var(--shadow);cursor:pointer;transition:transform .12s}
nav button:hover{transform:translateX(3px)}
nav button.on{background:var(--on);color:var(--onink)}
main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:0 clamp(12px,3.5vw,50px) clamp(10px,2vw,24px) clamp(12px,5vw,150px)}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:center;padding:clamp(10px,2vw,22px) 0 clamp(8px,1.4vw,16px)}
.hint{font-weight:800;color:#c8874a;font-size:clamp(14px,min(1.6vw,3vh),23px)}
.speed{display:flex;gap:6px;align-items:center;color:var(--muted);font-weight:700;font-size:14px}
.speed button{border:2px solid var(--accent);background:transparent;color:var(--ink);border-radius:999px;padding:5px 12px;font:700 14px inherit;font-family:inherit;cursor:pointer}
.speed button.on{background:var(--accent);color:#fff}
#page{flex:1;min-height:0;overflow-y:auto;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:contain;background:var(--panel);border-radius:clamp(24px,3vw,44px);padding:clamp(14px,3vh,52px) clamp(16px,4vw,76px);box-shadow:0 10px 30px var(--shadow);scrollbar-width:thin}
#page h1{margin:0 0 6px;font-size:clamp(16px,1.5vw,22px);color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.part{margin:0 0 .4em;font-size:clamp(20px,min(3.4vw,6vh),50px);font-weight:400;letter-spacing:.02em;margin-top:.6em}
#page p{margin:0;font-size:clamp(18px,min(3vw,5.2vh),46px);line-height:1.75;font-weight:400;word-spacing:.18em}
.w{display:inline;cursor:pointer;border-radius:.3em;padding:.04em .05em;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;transition:background .12s}
@media (hover:hover){.w:hover{background:var(--hl)}}
.w.on{background:var(--on);color:var(--onink)}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:2em}
.pn button{border:0;border-radius:999px;padding:12px 24px;background:var(--on);color:var(--onink);font:800 17px inherit;font-family:inherit;cursor:pointer}
.pn button:disabled{opacity:.35;cursor:default}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:12px;display:none;z-index:9}
@media (max-width:1000px){main{padding-left:16px}.logo{margin-left:20px}}
@media (max-width:760px),(max-height:520px){
.app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
aside{padding:10px 0 4px 12px;flex-direction:row;align-items:center;gap:10px}
.logo{margin:0;width:auto;flex:none;padding:10px 22px 10px 16px}
.logo b{font-size:19px}.logo span{font-size:13px}.logo svg{width:22px;height:22px;right:-2px;top:0}
.sub{display:none}
nav{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:6px 12px 10px 0;align-items:center}
nav h3{margin:0;flex:none;font-size:11px}
nav button{flex:none;width:auto;margin:0;padding:11px 16px;white-space:nowrap}
main{padding:0 10px 10px}
#page p,.part{font-size:clamp(20px,5.4vw,30px)}#page p{line-height:1.7}
.bar{gap:6px 12px}
}
</style>
</head>

<script>
const D=[{"set":"Storyfun 1","stories":[{"n":1,"t":"Counting","parts":[{"h":"PART 1","l":["Hi!","My name’s Ben and I’m your friend.","And this is Sam.","Sam is my dog.","Sam plays with my shoes.","Sam?","My shoes, please!","My name’s Ben and I’m your friend.","1, 2, 3","Count with me!"]},{"h":"PART 2","l":["4, 5, 6, 7","Silly Sam!","My blue shoe, please!","Good dog, Sam.","Well done!","Right!","8, 9, 10.","Let’s count again."]},{"h":"PART 3","l":["1, 2, 3","That’s right!","With me!","4, 5, 6, 7 and 8.","That’s really, really, really great!"]},{"h":"PART 4","l":["Oh, and then, It’s 9 and ...?","Silly Sam.","My red boot, please!","Good dog, Sam.","Well done!","So ... How many?","It’s 9 and 10.","Goodbye!"]}]},{"n":2,"t":"Come and play","parts":[{"h":"PART 1","l":["Hi!","I’m Anna.","I’ve got two cars and four guitars!","Come and play with me today!","I’ve got three kites and a yellow bike.","Come and play with me today!"]},{"h":"PART 2","l":["Hi!","I’m Tom.","I’ve got some bats and some funny red hats!","Come and play with me today!","I’ve got five ducks and two big trucks.","Come and play with me today!"]},{"h":"PART 3","l":["My name’s Sue.","I’ve got a doll.","And look!","Here’s my blue book!","My name’s Pat.","I’ve got a lizard and lots of pears and here’s my happy teddy bear.","Come and play with us today!"]},{"h":"PART 4","l":["We’ve got lots of pets, too.","They can play with you!","We’ve got a cat, a dog and three green frogs.","So clap your hands and come and play.","Come and play with us today!"]}]},{"n":3,"t":"Kim’s birthday","parts":[{"h":"PART 1","l":["It’s my birthday today!","Hooray!","Hooray!","This is my mum and dad.","This is my brother, Dan.","This is my sister.","Her name’s Jill!","And Grandpa’s here, too!","My grandpa’s name is Bill.","I love him!"]},{"h":"PART 2","l":["Mum: “Let’s have a party!”","Grandpa Bill: “Let’s make a big cake!”","Dan: “Let’s have some fun!”","Dad: “Let’s sing lots of songs!”","Jill: “Let’s get some balloons!”","It’s my birthday today!","Hooray!","Hooray!","I’ve got lots of cards and a new box of paints.","These are my presents, too!","Look!","Wow!","Thank you!"]},{"h":"PART 3","l":["Is this a bat?","No, it’s a sun hat.","Is this a clock?","No, they’re some socks.","Is this a toy tiger?","No, it’s a toy spider!","It’s my birthday today!","Hooray!","Hooray!","It’s my party now.","We’ve got lemonade and ice cream!","But where’s my toy spider?","It’s on Grandpa’s head!"]},{"h":"PART 4","l":["This cake is great!","And now I’m eight!","How old are you?","Are you eight, too?","Thank you, Mum and Dad and Jill.","And thank you, Dan and Grandpa Bill!"]}]},{"n":4,"t":"Hugo’s school bag","parts":[{"h":"PART 1","l":["It’s a school day today!","Right!","What’s in my bag?","My new crayons and paints.","My old eraser and phone.","But where is my ruler?","Oh!","There, with my book.","And where is my pen?","Oh!","There it is.","Good!"]},{"h":"PART 2","l":["Look at the clock!","Bye, Mum.","Bye, Sue.","I’ve got my school bag.","See you!","Run to the bus stop.","Quick!","Quick!","And jump on the bus.","Hi, Grace!","Hello, Nick!"]},{"h":"PART 3","l":["We love our new playground.","Let’s have some fun.","Here!","Catch this ball.","And jump and run!","This is my classroom.","And this is Miss Rice.","She’s our new teacher.","She’s really nice.","We’re making a poster.","Right!","What’s in my bag?","My new crayons and paints.","My old eraser and phone."]},{"h":"PART 4","l":["But where is my ruler?","It’s not here with my book.","And where is my pen?","It’s not here.","Oh no!","Look!","‘Don’t worry!’ says Mark.","‘Here you are!","Have my ruler.","I’ve got two!","They’re for you.’","‘It’s OK!’ says May.","‘Here you are!","Have my pen.","I’ve got three!","For you and me!’","‘Thank you!","Thank you!’"]}]},{"n":5,"t":"What am I?","parts":[{"h":"PART 1","l":["“Excuse me!","What am I?","Can you tell me, please?”","“Well, you aren’t an elephant.","I’m an elephant and my body is very big.","Your body is very small.","Have you got big ears?”","“No, I haven’t.”","“Well, elephants have got big ears.","No.","You aren’t an elephant.","Sorry!”"]},{"h":"PART 2","l":["“Excuse me!","What am I?","Can you tell me, please?”","“Well, you aren’t a crocodile.","I’m a crocodile and I’ve got lots of long white, teeth.","You haven’t got teeth.","Have you got a long tail?”","“No, I haven’t.","My tail is short.”","“Well, crocodiles have got long tails.","No.","You aren’t a crocodile.","Sorry!”"]},{"h":"PART 3","l":["“Excuse me!","What am I?","Please tell me!”","“Well, you aren’t a monkey.","I’m a monkey and I’ve got a funny face.","You haven’t got a funny face!","Can you climb trees?”","“No, I can’t!”","“Well, monkeys can climb trees.","No.","You aren’t a monkey.","Sorry!”"]},{"h":"PART 4","l":["“Excuse me!","What am I?","I’m not an elephant.","I’m not a crocodile and I’m not a monkey.","I’ve got two brown wings and two yellow feet.”","“Me too!”","“I can swim.","I can walk and I can fly.”","“Me too!","You’re a duck, you see!","You’re a duck like me!”","“I’m a DUCK!","Yippee!”"]}]},{"n":6,"t":"Grandma’s glasses","parts":[{"h":"PART 1","l":["Grandma is at Jill’s house.","She wants to go home now, but she can’t find her glasses.","‘I’ve got my handbag and I’ve got my coat.","I’ve got my toothbrush and I’ve got my bike.","But where are my glasses?’ asks Grandma.","‘I can help!’","‘Let’s look on the table and in the cupboard, too!’ says Tom.","‘No!","Your glasses aren’t here!","But look!","Wow!","My robot!","Great!’"]},{"h":"PART 2","l":["‘Let’s look under the TV and next to the computer,’ says Jill.","‘No!","They aren’t here!","But look!","Wow!","My old ruler!","Great!’","‘Let’s look next to the armchairs and under the cushions,’ says Mum.","‘No!","Your glasses aren’t here!","But look!","Wow!","My red socks!","Great!’"]},{"h":"PART 3","l":["‘Oh dear!","With no glasses, I can’t ride my bike!’ Grandma says.","‘We can drive you home!’ Dad says.","‘Can we come too?’ ask Tom and Jill.","‘Yes, you can!’ says Dad."]},{"h":"PART 4","l":["‘Thank you,’ says Grandma.","‘Wow!","It’s hot in here!’","‘Grandma!’ Tom and Jill say, ‘Your glasses are on your head!’","‘Fantastic!’ says Grandma.","‘Now I can ride home.’"]}]},{"n":7,"t":"Let’s go there now!","parts":[{"h":"PART 1","l":["Matt and Alice live next to the beach in Sea Street.","In the morning, Matt sees Alice at the bus stop.","Matt and Alice like lots of sports.","‘Hi, Alice!’ Matt says.","‘I’ve got badminton today.","I love badminton.","Do you?’","‘No,’ Alice answers.","‘But I really like horse riding!’","‘I don’t,’ says Matt.","‘Bye!","See you!’"]},{"h":"PART 2","l":["At lunchtime, Alice sees Matt at the sports shop.","‘Hi again, Matt!’ Alice says.","‘I love tennis.","Do you?’","‘Tennis?","No!","But baseball is a great sport!’ says Matt.","‘Do you like baseball?’","‘No, I don’t,’ says Alice.","‘Bye!","See you!’"]},{"h":"PART 3","l":["In the afternoon, Matt sees Alice in the playground.","‘Hello again!’ Matt says.","‘I love skateboarding!","Do you?’","‘Yes, I do!’ says Alice.","‘Which is your skateboard, Matt?’","‘The red one,’ answers Matt.","‘And which is your skateboard, Alice?’","‘The grey one,’ Alice answers.","‘Where do you go skateboarding?’","‘In the park!’ says Matt.","‘Me too!’ says Alice.","‘Let’s go and skateboard there!’ says Matt.","‘OK,’ says Alice.","‘Yes!","Let’s go there now!’"]},{"h":"PART 4","l":["‘My father and I like fishing here, too.","Do you?’ asks Alice.","‘No, I don’t,’ answers Matt.","‘I don’t like fishing!’","Ohhhhh ...","‘Do you like swimming, Matt?’ asks Alice.","‘Yes, I do!’ says Matt!"]}]},{"n":8,"t":"Not today!","parts":[{"h":"PART 1","l":["Dan and his sister, Lucy, are with their mother in Mr Chip’s food shop.","‘Can we have some oranges or some nice red grapes, Mum?’","‘Not today, Dan.","We’ve got a lot of fruit at home.’","‘I love apple pie, Mum!’","‘Me too!","But no apple pie today.’"]},{"h":"PART 2","l":["‘Wow!","Meatballs!’","‘Not today, Lucy.’","‘Let’s get some tomatoes!’","‘We can’t, but let’s get some carrots.’","‘What’s this?","What are these?’","‘Sorry, Mum!’","Lucy and her brother are in Miss Coat’s clothes shop now."]},{"h":"PART 3","l":["‘I love this watch!’","‘Can I have one of these T-shirts?’","‘No, Lucy and no, Dan.’","‘Look!","Shorts!","They’re so cool!’","‘And can I have those jeans?’","‘No.","But we can get two new white shirts for school.","Come on!","Let’s go!’","‘What’s this?","What are these?’","‘Sorry!’"]}]}]},{"set":"Storyfun 2","stories":[{"n":1,"t":"Our funny home","parts":[{"h":"PART 1","l":["Our home is really funny.","The window is under the cupboard.","Our radio is in Mum’s old hat.","There are three chairs in front of those flowers and ten oranges next to the cat … in our kitchen!"]},{"h":"PART 2","l":["My grandma’s sleeping in the bath again!","Look!","She’s behind her funny old door.","Five ducks are enjoying the water and can you see those four boats on the floor … in our bathroom?","The TV is between two big bookcases.","My pet lizard lives under it.","Oh … there are nine balloons on Dad’s armchair today.","And where is our baby hippo?","In our living room!"]},{"h":"PART 3","l":["Two clocks are behind that painting of frogs.","My football is here!","It’s not in our hall.","Grandpa’s teeth are on our big table again.","And can you see the tree on the wall … in our dining room?","My lamp is in front of six boxes.","There are 11 new books on my head.","Our green snake sleeps on that computer and there are 12 shoes under my bed … in my bedroom!"]},{"h":"PART 4","l":["Our home is old and we have lots of pets.","Mum says, ‘It’s like a zoo!’","‘But I love my family and I love my home!’","Would you like to live here too?"]}]},{"n":2,"t":"Jill’s jellyfish","parts":[{"h":"","l":["Nick, Sue and Ben are friends.","They’re playing a game.","Nick is choosing an animal and his friends, Sue and Ben, are asking questions.","‘How many legs have you got?’ asks Sue.","‘Four!’ says Nick.","‘What colour are you?’ asks Ben.","‘One of my colours is white,’ says Nick.","Ben’s little sister, Jill, wants to play too.","‘Can I try, please?’ she asks.","‘You’re a cow!’","‘No, Jill.’","‘Well, you’re a horse or a polar bear!’","‘No, Jill.’","‘Then you’re a zebra!’ says Ben.","‘That’s right!’ says Nick.","‘Now you choose an animal, Ben.’"]}]},{"n":3,"t":"Uncle Fred and me","parts":[{"h":"PART 1","l":["My uncle Fred likes going to the park and running with his friends.","My uncle Fred likes fishing in the lake, watching hockey on TV and eating chocolate cake!","‘Wow!","What a big fish!","Oh no!","What an old boot!’ says Uncle Fred."]},{"h":"PART 2","l":["My uncle Fred loves walking with his ducks and singing in the rain.","My uncle Fred loves playing his guitar, wearing very silly clothes and taking photos of his car!","‘What a beautiful yellow car!","I love my car!’ says Uncle Fred."]},{"h":"PART 3","l":["‘I like flying my new kite and I like riding on my bike.’","I love jumping, one, two, three, and reading scary stories in this tree.","A-L-P-H-A-B-E-T","I like watching happy little birds and I love spelling very long words.","Alphabet!","What a long word!"]},{"h":"PART 4","l":["Uncle Fred and I love wearing funny socks and sitting on these rocks.","We love finding big white shells and swimming in the sea.","I love my uncle Fred and my uncle Fred loves me!"]}]},{"n":4,"t":"Mrs Day’s garden","parts":[{"h":"PART 1","l":["Mr Gray is a farmer.","There are cows, sheep, goats, ducks and chickens on his farm.","There’s a dog too!","Mrs Day lives next to Mr Gray’s farm.","There are potatoes, onions, beans, peas and two pear trees in her garden.","Mr Gray is going to the town now.","He’s going in his truck.","Mrs Day is going to the shops.","She’s going on the bus."]},{"h":"PART 2","l":["Oh dear!","Mr Gray’s farm gate is open.","Oh dear!","Mrs Day’s garden gate is open too!","Look at the cows and sheep!","Look at the goats and ducks and chickens!","They’re running and jumping in Mrs Day’s garden!"]},{"h":"PART 3","l":["They’re eating her potatoes and her onions and peas.","They’re eating her beans and the pears in her trees.","They’re wearing her hats and her T-shirts and shirts.","They’re wearing her dresses and sweaters and skirts!"]},{"h":"PART 4","l":["But look!","Here’s Mrs Day.","She’s coming home from the shops.","Mr Gray’s coming home too.","‘I’m very angry!’ says Mrs Day.","‘Look at my clothes and look at my trees!’","‘I’m very sorry!’ says Mr Gray.","‘Would you like to have dinner with me?’"]}]},{"n":5,"t":"Classmates","parts":[{"h":"PART 1","l":["The children in Mr Bath’s class are reading stories this morning.","They’re reading about a jungle and a zoo.","The monster in Mr Bath’s class isn’t reading stories this morning.","It’s painting suns and stars on Anna’s shoe!"]},{"h":"PART 2","l":["The children in Mr Bath’s class are doing lots of sports now.","They’re playing soccer, tennis or baseball.","The monster from Mr Bath’s classroom isn’t doing sport now.","It’s drawing funny faces on the wall!","The children in Mr Bath’s class are going home now.","They’re getting their tablets and bags and books and pens.","The monster in Mr Bath’s class isn’t going home now.","It lives behind the door of classroom ten!"]},{"h":"PART 3","l":["Mr Bath can’t see the monster.","But the children in his class can!","They whisper, ‘Now, BE GOOD!’ and wave goodbye.","But the monster isn’t listening.","It’s playing the piano!","They love their friend, the monster.","‘So do I!’"]}]},{"n":6,"t":"I want that game!","parts":[{"h":"PART 1","l":["Tom is watching television at home this evening.","Three other children, Sue, Lucy and Bill, are watching TV in their homes too.","‘I want… that game!’","The four children have a lot of computer games BUT …","‘I want that game!’ they all say to their parents."]},{"h":"PART 2","l":["Tom’s father has a helicopter.","In the morning, Tom says, ‘Please fly me to Computer Fun in Candy Street, Dad!","I want that game!’","‘OK,’ Tom’s father says.","‘Jump in!’","Sue’s sister is getting on her motorbike.","‘Can you take me to Computer Fun in Candy Street, please?","I want that game!’ she says.","‘OK!’ says Sue’s sister."]},{"h":"PART 3","l":["Lucy runs to the bus.","‘Can you drive me to Computer Fun in Candy Street?’ she asks.","‘I want that game!’","‘OK!’ says the bus driver.","Bill phones his aunt.","‘Can you take me to Computer Fun in Candy Street in your lorry?’ he asks.","‘I want that game!’","‘OK,’ says his aunt.","Sue, Tom, Lucy and Bill are in the store now.","‘We’ve only got ONE game now,’ says the man in the store.","‘I want it!’ says Sue.","‘Me too!’ says Tom.","‘So do I!’ says Lucy.","‘And me!’ says Bill.","He takes the game.","‘It’s mine now!’ he says."]},{"h":"PART 4","l":["One little girl is crying.","‘My friends have got a lot of computer games.","But I have no computer games.","Can I have that game, please?’","Bill looks at the little girl.","Sue, Tom and Lucy look at her too.","‘Yes!’ says Sue.","‘Don’t cry.’","Then Sue looks at Tom.","‘Yes!’ says Tom.","‘Don’t worry.’","Then Tom looks at Lucy.","‘Yes!’ says Lucy.","‘Don’t be sad.’","Then Lucy looks at Bill.","Bill smiles and gives the game to the little girl.","‘Here you are!’ he says.","‘It’s not ours.","It’s yours now.","Have fun!’","The little girl is really happy.","‘Thanks!’ she says.","Sue, Tom, Lucy and Bill are happy too."]}]},{"n":7,"t":"Monkey beach","parts":[{"h":"PART 1","l":["Eva lives next to Monkey Beach.","She’s sitting on the sand there today.","She has some lime juice to drink.","She has a kiwi and some mangoes to eat.","She has her guitar to play and her tablet too."]},{"h":"PART 2","l":["Eva’s singing a song.","She waves to Miss Board.","‘Hello, Eva!’ says Miss Board.","‘Are you having fun?’","‘Yes, I am, thanks!’","‘Good!","Is that a monkey behind you?’","‘A monkey?’ says Eva.","‘No!","Bye, Miss Board!’","Eva’s taking photos now.","She sees Mr Page.","‘Hi, Eva!’ says Mr Page.","‘You’ve got a very happy smile on your face!’","‘Yes, I have.","Well, it’s a beautiful day!’","‘Yes, it is, Eva!","There’s a monkey behind you!","Do you know that?’","‘A monkey?","Behind me?","Ha ha!’ says Eva.","‘Goodbye, Mr Page!’"]},{"h":"PART 3","l":["Eva’s hitting her ball with her new bat now.","Eva smiles at Mrs Short.","‘Good morning, Eva!’ says Mrs Short.","‘How are you?’","‘Really great, thank you!’","‘Fantastic!","Have you got a pet monkey now, then?’","‘A pet monkey?","No, I haven’t!’ answers Eva.","‘See you, Mrs Short!’","Eva’s sitting on the sand again, now.","‘Right!","Where’s my tablet?’ she says."]},{"h":"PART 4","l":["‘Oh!","There it is!","Hi, Mr Monkey!’ Eva says.","The monkey smiles and gives Eva her tablet and a coconut!","‘My tablet and a coconut?","For me?","Thank you,’ Eva says and claps her hands.","‘Sing a happy song.","Be happy!","Be happy!’","‘Enjoy your fruit, Mr Monkey, and enjoy my song too,’ Eva laughs."]}]},{"n":8,"t":"Winners!","parts":[{"h":"PART 1","l":["Today, we’re playing basketball with The Five Suns.","They’re fantastic!","Alice, Dan and Sam can run very fast.","And Matt and Pat are very tall.","Watch them go!","Oh, wow!","They can really throw that ball!","Right!","Let’s start this game!","We’re running and jumping and bouncing and watching.","We’re stopping and starting.","We’re throwing and catching.","What’s the score?","Oh no!","We’ve got three and they’ve got four."]},{"h":"PART 2","l":["‘Throw it to Kim!’ Jill says.","‘Run, run!’ Jim says.","‘Catch!’ Kim says to me.","‘Now bounce it, bounce it and run, run, run!","Oh, well done!","It’s in the net!’"]},{"h":"PART 3","l":["What’s the score now?","Hooray!","We’ve got five and they’ve got four.","We’re the winners!","Now our team is smiling.","Can you jump and run fast too?","The Five Stars are very happy now.","‘We’re all winners.’","So are you!"]}]}]}];
const $=s=>document.querySelector(s),nav=$('#nav'),page=$('#page'),synth=window.speechSynthesis;
const flat=[];D.forEach((b,i)=>b.stories.forEach((s,j)=>flat.push([i,j])));
let cur=[0,0],rate=.65,voice=null,lastEl=null,lastAt=0,aud=null;
const AUDIO={};/* word -> audio file (data URI); overrides the voice */
const SAY={live:'liv',lives:'livz'};/* word -> respelling the voice reads instead */
try{const r=localStorage.getItem('rate');if(r)rate=+r}catch(e){}
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function pick(){if(!synth)return;const v=synth.getVoices().filter(x=>/^en/i.test(x.lang));
 for(const r of [/(natural|neural|online).*(en-US|us)|en-US.*(natural|neural|online)/i,/google us english/i,/samantha|aria|jenny|ava|allison|zira/i,/en[-_]US/i,/./]){const f=v.find(x=>r.test(x.name+' '+x.lang));if(f){voice=f;return}}}
if(synth){pick();synth.onvoiceschanged=pick}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function say(el,force){
 const now=Date.now();
 if(!force&&el===lastEl&&now-lastAt<600)return;
 lastAt=now;
 const key=el.dataset.s.toLowerCase();
 if(synth&&(synth.speaking||synth.pending))synth.cancel();
 if(aud){aud.pause();aud=null}
 if(lastEl)lastEl.classList.remove('on');el.classList.add('on');lastEl=el;
 const off=()=>el.classList.remove('on');
 if(AUDIO[key]){const a=aud=new Audio(AUDIO[key]);a.playbackRate=rate<.5?.75:rate<.8?.9:1;a.onended=a.onerror=off;a.play().catch(off);return}
 if(!synth){off();toast('Sorry, this browser can’t speak words.');return}
 const u=new SpeechSynthesisUtterance(SAY[key]||el.dataset.s);
 u.lang='en-US';if(voice){u.voice=voice;u.lang=voice.lang}
 u.rate=rate;u.pitch=1;u.volume=1;
 u.onend=off;u.onerror=off;
 synth.speak(u);
}
function words(line){return line.split(/\s+/).map(t=>{
 const c=t.replace(/^[^\p{L}\p{N}]+/u,'').replace(/[^\p{L}\p{N}]+$/u,'').replace(/’/g,"'");
 return c?'<span class="w" data-s="'+esc(c).replace(/"/g,'')+'">'+esc(t)+'</span>':esc(t)}).join(' ')}
function render(){
 const [b,s]=cur,st=D[b].stories[s],i=flat.findIndex(f=>f[0]==b&&f[1]==s);
 let h='<h1>'+D[b].set+' · '+st.n+'. '+esc(st.t)+'</h1>';
 st.parts.forEach(p=>{if(p.h)h+='<div class="part">'+p.h+'</div>';p.l.forEach(l=>h+='<p>'+words(l)+'</p>')});
 h+='<div class="pn"><button id="pv"'+(i?'':' disabled')+'>← Back</button><button id="nx"'+(i<flat.length-1?'':' disabled')+'>Next story →</button></div>';
 page.innerHTML=h;page.scrollTop=0;if(synth)synth.cancel();
 let n='';D.forEach((bk,bi)=>{n+='<h3>'+bk.set+'</h3>';bk.stories.forEach((x,si)=>n+='<button data-b="'+bi+'" data-s="'+si+'"'+(bi==b&&si==s?' class="on"':'')+'>'+x.n+'. '+esc(x.t)+'</button>')});
 nav.innerHTML=n;const a=nav.querySelector('.on');if(a)a.scrollIntoView({block:'nearest',inline:'center'});
 $('#pv').onclick=()=>go(...flat[i-1]);$('#nx').onclick=()=>go(...flat[i+1]);
}
function go(b,s){const h='#b'+(b+1)+'-s'+(s+1);location.hash===h?load():location.hash=h}
function load(){const m=/^#b(\d+)-s(\d+)$/.exec(location.hash);let b=0,s=0;if(m){b=m[1]-1;s=m[2]-1}if(!D[b]||!D[b].stories[s])b=s=0;cur=[b,s];render()}
nav.addEventListener('click',e=>{const x=e.target.closest('button');if(x)go(+x.dataset.b,+x.dataset.s)});
let ht=null,held=false,sx=0,sy=0,unlocked=false;
function unlock(){if(unlocked||!synth)return;unlocked=true;const u=new SpeechSynthesisUtterance(' ');u.volume=0;synth.speak(u)}
page.addEventListener('click',e=>{if(held){held=false;return}const w=e.target.closest('.w');if(w)say(w)});
page.addEventListener('touchstart',e=>{unlock();const w=e.target.closest('.w');held=false;clearTimeout(ht);if(!w||e.touches.length>1)return;const t=e.touches[0];sx=t.clientX;sy=t.clientY;ht=setTimeout(()=>{held=true;say(w,true)},420)},{passive:true});
page.addEventListener('touchmove',e=>{const t=e.touches[0];if(Math.abs(t.clientX-sx)+Math.abs(t.clientY-sy)>12)clearTimeout(ht)},{passive:true});
page.addEventListener('touchend',e=>{clearTimeout(ht);if(held){e.preventDefault();setTimeout(()=>{held=false},400)}},{passive:false});
page.addEventListener('touchcancel',()=>clearTimeout(ht));
page.addEventListener('contextmenu',e=>{if(e.target.closest('.w'))e.preventDefault()});
$('#speed').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;rate=+b.dataset.r;try{localStorage.setItem('rate',rate)}catch(x){}sync();const w=lastEl;if(w)say(w,true)});
function sync(){document.querySelectorAll('#speed button').forEach(b=>b.classList.toggle('on',+b.dataset.r===rate))}
if(![.45,.65,.9].includes(rate))rate=.65;
sync();addEventListener('hashchange',load);load();
</script>
